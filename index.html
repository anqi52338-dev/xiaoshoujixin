<title>小手机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: one phone centred on a sage desk; a short guide sits beside it on wide screens. Each app inside the phone keeps its own palette. */
:root{
  --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --hand:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;

  --page:#EFEBE6; --page-ink:#3B3632; --page-sub:#8C847C; --page-line:#DCD5CD;
  --bezel:#2A2725; --hw:#000000; --on-color:#FFFFFF; --on-wall:#FFFFFF; --on-pri:#FFFFFF;
  --ink-dark:#3B3632; --ink-light:#F6F1EA; --home-ink:var(--ink-dark);
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.85); --tile:#FFFFFF; --tile-ink:#3B3632;

  --wx-bg:#F6F3EF; --wx-bar:#FBF9F7; --wx-card:#FFFFFF; --wx-pin:#F3EEE8; --wx-text:#2E2A27; --wx-sub:#9A928A;
  --wx-line:#ECE6DF; --wx-green:#3B3632; --wx-me:#E7DCCE; --wx-me-text:#2E2A27; --wx-other:#FFFFFF;
  --wx-link:#8A6F5A; --wx-input:#FFFFFF; --wx-quote:#F1ECE6; --wx-red:#E07C69; --wx-press:rgba(59,54,50,.06);
  --rp:#DF8270; --rp-deep:#C96B5A; --rp-done:#EFC6BA; --gold:#F6DDB0; --gold-ink:#7A5230; --tf:#E0A574; --tf-done:#F0D6BD;
  --map:#EFEAE2; --map-line:#E0D8CC; --menu:#3B3632; --call:#2A2623; --call-sub:#B6ADA4;

  --sheet:#FFFDFB; --sheet-gap:#F3EFEA; --sheet-line:#EEE8E1; --sheet-text:#2E2A27; --sheet-sub:#9A928A;
  --field:#F4F0EB; --mask:rgba(40,34,30,.38); --danger:#CF5F4E; --toast:rgba(46,42,39,.88); --banner:rgba(255,253,250,.95);

  --d-paper:#F6F1EA; --d-card:#FFFDF9; --d-line:#E8DFD3; --d-ink:#3B3632; --d-sub:#9A8F83; --d-seal:#C27A68; --d-chip:#F1EAE1;
  --c-bg:#FBF9F6; --c-text:#2E2A27; --c-sub:#A0978E; --c-accent:#C4826F; --c-soft:#F3EEE8; --c-line:#ECE6DF;
  --m-bg:#F8F4EE; --m-card:#FFFFFF; --m-accent:#A8876A; --m-text:#2E2A27; --m-sub:#A0968A; --m-line:#EEE7DD;
  --s-bg:#F5F2EE; --s-card:#FFFFFF; --s-text:#2E2A27; --s-sub:#9A928A; --s-line:#ECE6DF; --s-accent:#8A6F5A;

  --wall-cream:radial-gradient(70% 45% at 85% 8%,#FFFFFF 0%,transparent 70%),radial-gradient(80% 55% at 0% 100%,#E9DCCB 0%,transparent 70%),linear-gradient(175deg,#F8F3EC 0%,#F1E9DF 55%,#EADFD1 100%);
  --wall-blush:radial-gradient(70% 45% at 80% 5%,#FFF6F2 0%,transparent 70%),radial-gradient(90% 60% at 10% 95%,#E8C8C0 0%,transparent 70%),linear-gradient(175deg,#F7ECE7 0%,#F0DDD6 60%,#E6CCC4 100%);
  --wall-sage:radial-gradient(70% 45% at 80% 5%,#F7F8F2 0%,transparent 70%),radial-gradient(90% 60% at 0% 100%,#C9D2C0 0%,transparent 70%),linear-gradient(175deg,#EEF0E8 0%,#E1E6D9 60%,#D3DACA 100%);
  --wall-mist:radial-gradient(70% 45% at 80% 5%,#F7F8FA 0%,transparent 70%),radial-gradient(90% 60% at 0% 100%,#C8CFD8 0%,transparent 70%),linear-gradient(175deg,#EEF0F3 0%,#E0E4EA 60%,#D2D8E0 100%);
  --wall-night:radial-gradient(80% 50% at 75% 15%,#4A4038 0%,transparent 70%),linear-gradient(180deg,#2B2622 0%,#211D1A 60%,#181513 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#171513; --page-ink:#E4DDD5; --page-sub:#8C847C; --page-line:#2E2A27;
    --bezel:#0A0908; --on-pri:#1E1B19;
    --wx-bg:#141211; --wx-bar:#1C1A18; --wx-card:#1E1C1A; --wx-pin:#262320; --wx-text:#ECE6DF; --wx-sub:#8A827A;
    --wx-line:#2C2926; --wx-green:#E7DCCE; --wx-me:#4A423B; --wx-me-text:#F3ECE4; --wx-other:#2A2724;
    --wx-link:#C9AE95; --wx-input:#2A2724; --wx-quote:#262320; --wx-press:rgba(255,255,255,.06);
    --rp:#C46F5F; --rp-deep:#A85A4B; --rp-done:#6E4A42; --tf:#C08A5C; --tf-done:#6A5340;
    --map:#2A2622; --map-line:#38332D; --menu:#4A443F;
    --sheet:#211E1C; --sheet-gap:#161413; --sheet-line:#2F2B28; --sheet-text:#ECE6DF; --sheet-sub:#8A827A;
    --field:#2C2926; --mask:rgba(0,0,0,.6); --danger:#E7826F; --banner:rgba(42,39,36,.95);
    --d-paper:#1A1816; --d-card:#23201D; --d-line:#332E29; --d-ink:#E6DED4; --d-sub:#958B80; --d-seal:#DB8E7A; --d-chip:#2D2925;
    --c-bg:#141211; --c-text:#F0EAE3; --c-sub:#8E857C; --c-accent:#DE9C88; --c-soft:#1E1B19; --c-line:#2C2926;
    --m-bg:#161412; --m-card:#211E1B; --m-accent:#D1AE8C; --m-text:#EDE5DA; --m-sub:#8F8579; --m-line:#2E2A25;
    --s-bg:#121110; --s-card:#1E1C1A; --s-text:#F0EAE3; --s-sub:#8E857C; --s-line:#2C2926; --s-accent:#D1AE8C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --page:#171513; --page-ink:#E4DDD5; --page-sub:#8C847C; --page-line:#2E2A27;
    --bezel:#0A0908; --on-pri:#1E1B19;
    --wx-bg:#141211; --wx-bar:#1C1A18; --wx-card:#1E1C1A; --wx-pin:#262320; --wx-text:#ECE6DF; --wx-sub:#8A827A;
    --wx-line:#2C2926; --wx-green:#E7DCCE; --wx-me:#4A423B; --wx-me-text:#F3ECE4; --wx-other:#2A2724;
    --wx-link:#C9AE95; --wx-input:#2A2724; --wx-quote:#262320; --wx-press:rgba(255,255,255,.06);
    --rp:#C46F5F; --rp-deep:#A85A4B; --rp-done:#6E4A42; --tf:#C08A5C; --tf-done:#6A5340;
    --map:#2A2622; --map-line:#38332D; --menu:#4A443F;
    --sheet:#211E1C; --sheet-gap:#161413; --sheet-line:#2F2B28; --sheet-text:#ECE6DF; --sheet-sub:#8A827A;
    --field:#2C2926; --mask:rgba(0,0,0,.6); --danger:#E7826F; --banner:rgba(42,39,36,.95);
    --d-paper:#1A1816; --d-card:#23201D; --d-line:#332E29; --d-ink:#E6DED4; --d-sub:#958B80; --d-seal:#DB8E7A; --d-chip:#2D2925;
    --c-bg:#141211; --c-text:#F0EAE3; --c-sub:#8E857C; --c-accent:#DE9C88; --c-soft:#1E1B19; --c-line:#2C2926;
    --m-bg:#161412; --m-card:#211E1B; --m-accent:#D1AE8C; --m-text:#EDE5DA; --m-sub:#8F8579; --m-line:#2E2A25;
    --s-bg:#121110; --s-card:#1E1C1A; --s-text:#F0EAE3; --s-sub:#8E857C; --s-line:#2C2926; --s-accent:#D1AE8C;
    color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{font-feature-settings:"lnum" 1;margin:0;background:var(--page);color:var(--page-ink);font:14px/1.5 var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--wx-link);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
input,textarea{font:inherit}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:20px;box-sizing:border-box}
.guide{width:260px;flex:none;display:flex;flex-direction:column;gap:14px}
.guide h1{margin:0;font-family:var(--display),var(--serif);font-weight:400;font-size:40px;letter-spacing:.02em;color:var(--page-ink);text-wrap:balance}
.guide p{margin:0;color:var(--page-sub);line-height:1.7}
.guide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--page-line);padding-top:14px}
.guide li{display:grid;grid-template-columns:52px 1fr;gap:8px;line-height:1.6;color:var(--page-ink)}
.guide li b{font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--page-sub);padding-top:2px}
.phone{height:min(860px,100%);aspect-ratio:400/860;max-width:100%;background:var(--bezel);border-radius:56px;padding:11px;box-sizing:border-box;position:relative;flex:none;
  box-shadow:0 0 0 1.5px #4A4541 inset,0 30px 60px -24px rgba(60,45,35,.4),0 12px 24px -12px rgba(60,45,35,.25)}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--hw);container-type:size;isolation:isolate;-webkit-user-select:none;user-select:none}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:98px;height:29px;border-radius:20px;background:var(--hw);z-index:60;pointer-events:none}
@media (max-width:900px){.guide{display:none}}
@media (max-width:520px){
  .stage{padding-block:12px}
  .phone{height:100%;width:100%;aspect-ratio:auto;padding:0;background:none;box-shadow:none;border-radius:30px}
  .screen{border-radius:30px}
}

/* ---------- system chrome ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;box-sizing:border-box;
  font:600 15px/1 var(--ui);font-variant-numeric:tabular-nums;z-index:59;pointer-events:none;transition:color .3s;color:var(--on-wall)}
.sb-r{display:flex;gap:6px;align-items:center}
.home-bar{position:absolute;left:0;right:0;bottom:0;height:24px;z-index:58;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
.home-bar span{width:128px;height:5px;border-radius:3px;background:currentColor;opacity:.75;transition:width .2s}
.home-bar:hover span{width:150px}
.layers{position:absolute;inset:0;pointer-events:none}
.layers > .page{pointer-events:auto}
.page{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s,filter .34s;will-change:transform}
.page.in-slide{transform:translateX(100%)}
.page.in-app{transform:scale(.86);opacity:0}
.page.behind{transform:translateX(-28%);filter:brightness(.92)}
.page.in-up{transform:translateY(100%)}
@media (prefers-reduced-motion:reduce){.page,.home,.sheet,.mask,.modal,.banner{transition:none!important}}

.nav{flex:none;height:94px;padding-top:50px;box-sizing:border-box;display:grid;grid-template-columns:96px 1fr 96px;align-items:center}
.nav-l{display:flex;align-items:center;padding-left:6px}
.nav-r{display:flex;align-items:center;justify-content:flex-end;gap:2px;padding-right:8px}
.nav-t{text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav-t small{display:block;font-size:11px;font-weight:400;opacity:.6;margin-top:1px}
.ib{min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:10px;padding:0 4px}
.ib:active{background:var(--wx-press)}
.ib.sm{min-width:26px;height:26px}
.back span{font-size:15px;font-variant-numeric:tabular-nums}
.txtbtn{border:0;background:none;font-size:16px;padding:6px 10px;border-radius:8px}

/* ---------- home (ins style) ---------- */
.home{position:absolute;inset:0;color:var(--home-ink);transition:transform .38s cubic-bezier(.2,.8,.2,1),filter .38s}
.screen[data-wall=night]{--home-ink:var(--ink-light);--glass:rgba(255,255,255,.1);--glass-line:rgba(255,255,255,.16);--tile:rgba(255,255,255,.12);--tile-ink:#F6F1EA}
.home.dim{transform:scale(.94);filter:brightness(.82)}
.wall{position:absolute;inset:0;background:var(--wall-cream)}
.wall::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background-image:radial-gradient(rgba(120,100,80,.18) .6px,transparent .7px);background-size:3px 3px}
.wall.night::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 68% 8%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 84% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 26%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 12% 44%,#fff 50%,transparent 51%);opacity:.5}
.home-grid{position:absolute;top:62px;left:22px;right:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px}
.w{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);border-radius:22px;padding:14px 16px;box-sizing:border-box;box-shadow:0 0 0 .5px var(--glass-line) inset,0 8px 24px -14px rgba(80,60,45,.35);text-align:left;border:0;color:inherit}
.w-clock{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 4px 0}
.w-clock .t{font:400 72px/0.85 var(--display);letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.w-clock .d{font:italic 400 15px/1 var(--display);margin-top:10px;letter-spacing:.02em;opacity:.8}
.w-clock .d span{font:12px/1 var(--ui);font-style:normal;letter-spacing:.12em;margin-left:6px;opacity:.85}
.w-clock .wt{text-align:right;font-size:11px;line-height:1.6;letter-spacing:.08em;opacity:.75;padding-bottom:2px}
.w-clock .wt b{display:block;font:300 34px/1 var(--display);letter-spacing:0}
.eng{font:italic 400 13px/1 var(--display);letter-spacing:.02em;opacity:.7}
.polar{grid-column:span 2;position:relative;background:#FFFFFF;padding:9px 9px 0;border-radius:4px;box-shadow:0 10px 26px -12px rgba(80,60,45,.45),0 1px 2px rgba(80,60,45,.12);transform:rotate(-3deg);border:0;cursor:pointer;display:flex;flex-direction:column;align-self:center;max-width:100%}
.polar .ph{aspect-ratio:1;overflow:hidden;line-height:0;border-radius:2px}
.polar .ph svg{width:100%;height:100%;filter:saturate(.8) contrast(.95) sepia(.12)}
.polar .cap{font:17px/1 var(--hand);color:#5A514A;text-align:center;padding:9px 0 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.polar::before{content:"";position:absolute;top:-9px;left:50%;width:58px;height:18px;margin-left:-29px;background:rgba(232,214,196,.85);transform:rotate(4deg);box-shadow:0 1px 2px rgba(0,0,0,.06);z-index:1}
.quad{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;align-content:center}
.w-ev{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.w-ev .hd{display:flex;justify-content:space-between;align-items:baseline}
.w-ev .hd small{font-size:11px;letter-spacing:.1em;opacity:.6}
.w-ev .it{display:grid;grid-template-columns:7px 1fr auto;gap:10px;align-items:center;font-size:13px;line-height:1.35;min-width:0}
.w-ev .it i{width:7px;height:7px;border-radius:50%}
.w-ev .it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-ev .it em{font-style:normal;opacity:.6;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.w-dy{grid-column:1/-1;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.w-dy .seal{position:static;grid-row:span 2;width:44px;height:44px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font:19px/1 var(--hand);transform:rotate(-10deg);opacity:.75}
.w-dy .tt{font:19px/1.2 var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-dy .ex{font-size:12px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:11px;position:relative;color:inherit;letter-spacing:.06em}
.app:active .ai{transform:scale(.94)}
.ai{width:min(58px,100%);aspect-ratio:1;border-radius:30%;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);box-shadow:0 6px 16px -10px rgba(80,60,45,.5),0 0 0 .5px rgba(120,100,80,.12) inset;position:relative;overflow:hidden;transition:transform .15s}
.ai svg{width:48%;height:48%;stroke-width:1.35}
.ai-cal{display:flex;flex-direction:column;justify-content:center;gap:1px}
.ai-cal small{color:var(--c-accent);font-size:9px;font-weight:600;line-height:1.2;letter-spacing:.08em}
.ai-cal b{font:400 27px/1 var(--display)}
.app .bd{position:absolute;top:-5px;right:calc(50% - 34px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wx-red);color:var(--on-color);font-size:11px;font-weight:600;display:grid;place-items:center;box-sizing:border-box;z-index:2;box-shadow:0 0 0 2px var(--tile)}
.dock{position:absolute;left:16px;right:16px;bottom:28px;padding:12px 18px;border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 0 0 .5px var(--glass-line) inset;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dock .an{display:none}
.pager{position:absolute;bottom:134px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.pager i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3}.pager i:first-child{opacity:.8}
@container (max-height:760px){.w-dy{display:none}}
@container (max-height:660px){.w-clock .t{font-size:60px}.pager{display:none}.w-ev .it:nth-of-type(n+3){display:none}}

/* ---------- shared overlays ---------- */
.mask{position:absolute;inset:0;background:var(--mask);z-index:90;opacity:0;transition:opacity .25s}
.mask.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--sheet);color:var(--sheet-text);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:26px;max-height:78%;display:flex;flex-direction:column}
.sheet.show{transform:none}
.sheet-h{white-space:pre-line;padding:16px 20px 12px;text-align:center;font-size:13px;color:var(--sheet-sub);line-height:1.5}
.sheet-body{overflow-y:auto}
.sheet-item{display:block;width:100%;padding:16px;text-align:center;font-size:17px;border:0;background:none;border-top:.5px solid var(--sheet-line)}
.sheet-item:active{background:var(--wx-press)}
.sheet-item.danger{color:var(--danger)}
.sheet-gap{height:8px;background:var(--sheet-gap);flex:none}
.modal{position:absolute;left:28px;right:28px;top:50%;z-index:91;background:var(--sheet);color:var(--sheet-text);border-radius:16px;padding:22px 20px 18px;transform:translateY(-50%) scale(.92);opacity:0;transition:transform .25s,opacity .25s;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;max-height:80%;overflow-y:auto}
.modal.show{transform:translateY(-50%);opacity:1}
.modal h3{margin:0;font-size:17px;text-align:center}
.f-label{font-size:12px;color:var(--sheet-sub);margin-bottom:-6px}
.f-input{width:100%;box-sizing:border-box;border:0;background:var(--field);color:inherit;border-radius:10px;padding:11px 12px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
textarea.f-input{resize:none;min-height:90px;line-height:1.6}
.f-err{color:var(--danger);font-size:12px;min-height:16px;margin-top:-4px}
.f-row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;background:var(--field);color:inherit}
.btn.pri{background:var(--wx-green);color:var(--on-pri)}
.btn.red{background:var(--rp);color:var(--on-color)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--field);color:inherit}
.chip.on{background:var(--wx-green);color:var(--on-pri)}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.95);background:var(--toast);color:var(--on-color);padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:70%;text-align:center;line-height:1.5;white-space:pre-line}
.toast.show{opacity:1;transform:translate(-50%,-50%)}
.banner{position:absolute;top:50px;left:10px;right:10px;z-index:97;background:var(--banner);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--wx-text);border-radius:20px;padding:11px 14px;display:flex;gap:11px;align-items:center;transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.25,1.1);box-shadow:0 10px 30px -10px rgba(0,0,0,.35);cursor:pointer;border:0;text-align:left;width:calc(100% - 20px)}
.banner:not(.show){opacity:0;visibility:hidden;pointer-events:none;transition:transform .4s,opacity .3s,visibility 0s .4s}
.banner.show{transform:none}
.banner .bt{font-size:12px;color:var(--wx-sub);display:flex;justify-content:space-between}
.banner .bm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner > div{flex:1;min-width:0}
.viewer{position:absolute;inset:0;z-index:95;background:#000;display:grid;place-items:center;cursor:zoom-out}
.viewer svg{width:100%;height:auto}
.viewer p{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:#C9C9C9;font-size:13px;margin:0}
.flash{position:absolute;inset:0;background:#FFFFFF;z-index:98;opacity:0;pointer-events:none;transition:opacity .35s}
.flash.on{opacity:1;transition:none}
.shake{animation:shake .5s 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* ---------- avatar ---------- */
.av{width:var(--s,48px);height:var(--s,48px);border-radius:calc(var(--s,48px) * .14);display:grid;place-items:center;color:var(--on-color);font-weight:600;font-size:calc(var(--s,48px) * .42);flex:none;overflow:hidden;line-height:1}
.av svg{width:58%;height:58%}
.gav{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;box-sizing:border-box;background:var(--wx-quote)}
.gav .av{width:100%;height:100%;border-radius:2px}
.av.pat{animation:pat .6s}
@keyframes pat{0%,100%{transform:none}20%{transform:rotate(-12deg) scale(.92)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}

/* ---------- WeChat ---------- */
.wx{background:var(--wx-bg);color:var(--wx-text)}
.wx .nav{background:var(--wx-bar)}
.wx-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.wx-tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--wx-bar);border-top:.5px solid var(--wx-line);padding:7px 0 26px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;background:none;border:0;position:relative;padding:0}
.tab.on{color:var(--wx-green)}
.tab.on svg{fill:currentColor;fill-opacity:.16}
.tab .bd{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--wx-red);color:var(--on-color);font-size:11px;display:grid;place-items:center}
.wx-search{margin:2px 10px 8px;display:flex;align-items:center;gap:6px;background:var(--wx-card);border-radius:8px;padding:0 10px;height:36px;color:var(--wx-sub)}
.wx-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--wx-text);font-size:15px;-webkit-user-select:text;user-select:text}
.cl-item{display:flex;gap:12px;padding:12px 16px;background:var(--wx-card);position:relative;cursor:pointer;align-items:center}
.cl-item.pinned{background:var(--wx-pin)}
.cl-item.pressing,.row.pressing{background:var(--wx-press)}
.cl-item + .cl-item::before{content:"";position:absolute;left:76px;right:0;top:0;border-top:.5px solid var(--wx-line)}
.cl-av{position:relative;flex:none}
.cl-av .bd{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:var(--wx-red);color:var(--on-color);font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cl-av .dt{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--wx-red)}
.cl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cl-top,.cl-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cl-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-time{font-size:11px;color:var(--wx-sub);flex:none;font-variant-numeric:tabular-nums}
.cl-last{font-size:13px;color:var(--wx-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-last .at{color:var(--danger)}
.cl-last .ty{color:var(--wx-green)}
.cl-bot svg{flex:none;color:var(--wx-sub)}
.empty{padding:60px 20px;text-align:center;color:var(--wx-sub);font-size:13px;line-height:1.8}
.group{background:var(--wx-card);margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px;position:relative;cursor:pointer;width:100%;border:0;background:none;text-align:left;font-size:16px;box-sizing:border-box}
.row + .row::before{content:"";position:absolute;left:var(--indent,52px);right:0;top:0;border-top:.5px solid var(--wx-line)}
.row:active{background:var(--wx-press)}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--wx-sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.row .chev{color:var(--wx-sub);flex:none;opacity:.7}
.row .ri{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--on-color);flex:none}
.row .ri svg{width:18px;height:18px}
.row.center{justify-content:center;color:var(--danger)}
.idx{padding:6px 16px;font-size:12px;color:var(--wx-sub);background:var(--wx-bg)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--wx-line);position:relative;flex:none;transition:background .2s;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--wx-green)}.sw.on::after{transform:translateX(20px)}
.me-card{background:var(--wx-card);padding:24px 20px 28px;display:flex;gap:16px;align-items:center;margin-bottom:8px;cursor:pointer;border:0;width:100%;text-align:left}
.me-card .nm{font-size:21px;font-weight:600}
.me-card .id{font-size:13px;color:var(--wx-sub);margin-top:6px}
.me-card .sg{font-size:13px;color:var(--wx-sub);margin-top:2px}
.popmenu{position:absolute;top:92px;right:10px;z-index:92;background:var(--menu);color:var(--on-color);border-radius:8px;padding:4px 0;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.popmenu::before{content:"";position:absolute;top:-6px;right:18px;border:6px solid transparent;border-top:0;border-bottom-color:var(--menu)}
.popmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border:0;background:none;font-size:15px;color:inherit;text-align:left}
.popmenu button + button{border-top:.5px solid rgba(255,255,255,.12)}

/* chat */
.chat-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 14px}
.msg{display:flex;gap:10px;padding:7px 12px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg > .av{cursor:pointer}
.msg-main{max-width:calc(100% - 112px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.msg.me .msg-main{align-items:flex-end}
.msg-name{font-size:12px;color:var(--wx-sub);padding-left:2px;margin-top:-2px}
.bw{display:flex;align-items:center;gap:8px;max-width:100%}
.msg.me .bw{flex-direction:row-reverse}
.tail{position:relative}
.tail::before{content:"";position:absolute;top:13px;left:-4px;width:10px;height:10px;background:inherit;transform:rotate(45deg);border-radius:2px}
.msg.me .tail::before{left:auto;right:-4px}
.bubble{background:var(--wx-other);color:var(--wx-text);padding:9px 12px;border-radius:6px;font-size:16px;line-height:1.45;word-break:break-word;white-space:pre-wrap;max-width:100%;box-sizing:border-box;-webkit-touch-callout:none;cursor:default}
.msg.me .bubble{background:var(--wx-me);color:var(--wx-me-text)}
.pressing.bubble,.pressing .bubble,.b-img.pressing,.b-rp.pressing,.b-tf.pressing{filter:brightness(.88)}
.b-voice{display:flex;align-items:center;gap:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.msg.me .b-voice{flex-direction:row-reverse}
.b-voice svg{flex:none}
.msg.me .b-voice svg{transform:scaleX(-1)}
.b-voice.playing .w2{animation:wv 1s infinite .15s}.b-voice.playing .w3{animation:wv 1s infinite .3s}
@keyframes wv{0%,100%{opacity:1}50%{opacity:.15}}
.v-dot{width:8px;height:8px;border-radius:50%;background:var(--wx-red);flex:none}
.v-tx{background:var(--wx-other);color:var(--wx-text);font-size:14px;padding:8px 10px;border-radius:6px;max-width:100%;box-sizing:border-box;line-height:1.5}
.b-call{display:flex;align-items:center;gap:6px}
.b-img{width:150px;border-radius:6px;overflow:hidden;line-height:0;cursor:zoom-in;-webkit-touch-callout:none}
.b-img svg{width:100%;height:auto;display:block}
.b-stk{font-size:76px;line-height:1.05;-webkit-touch-callout:none}
.b-rp,.b-tf{width:228px;max-width:100%;border-radius:6px;background:var(--rp);color:var(--on-color);cursor:pointer;-webkit-touch-callout:none}
.b-tf{background:var(--tf)}
.b-rp.done{background:var(--rp-done)}.b-tf.done{background:var(--tf-done)}
.cd-top{display:flex;gap:10px;align-items:center;padding:12px 12px 10px;min-height:44px}
.cd-top .ttl{font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-top small{display:block;font-size:12px;opacity:.82}
.cd-top > div{min-width:0}
.cd-bot{font-size:11px;padding:5px 12px 6px;border-top:.5px solid rgba(255,255,255,.28);opacity:.88}
.rp-ico{width:30px;height:38px;border-radius:4px;background:var(--rp-deep);position:relative;flex:none}
.rp-ico::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;border-radius:4px 4px 50% 50%/4px 4px 8px 8px;background:rgba(255,255,255,.12)}
.rp-ico::after{content:"";position:absolute;left:50%;top:10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gold)}
.tf-ico{width:34px;height:34px;border-radius:50%;border:1.6px solid currentColor;display:grid;place-items:center;flex:none}
.tf-ico svg{width:18px;height:18px}
.b-card,.b-loc{width:228px;max-width:100%;background:var(--wx-other);color:var(--wx-text);border-radius:6px;cursor:pointer;-webkit-touch-callout:none}
.b-card .cd-bot,.b-loc .cd-bot{border-top-color:var(--wx-line);color:var(--wx-sub)}
.b-card .cd-top{gap:12px;padding:14px 12px}
.b-loc .lt{padding:10px 12px 8px}
.b-loc .lt b{font-weight:400;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-loc .lt small{font-size:12px;color:var(--wx-sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map{height:84px;border-radius:0 0 6px 6px;background-color:var(--map);background-image:linear-gradient(var(--map-line) 2px,transparent 2px),linear-gradient(90deg,var(--map-line) 2px,transparent 2px),linear-gradient(35deg,transparent 46%,var(--map-line) 46% 52%,transparent 52%);background-size:38px 30px,46px 30px,100% 100%;display:grid;place-items:center;color:var(--wx-red)}
.quote{font-size:12px;color:var(--wx-sub);background:var(--wx-quote);padding:5px 8px;border-radius:4px;max-width:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-time{text-align:center;font-size:12px;color:var(--wx-sub);padding:12px 0 4px;font-variant-numeric:tabular-nums}
.msg-sys{text-align:center;font-size:12px;color:var(--wx-sub);padding:6px 48px;line-height:1.6}
.msg-sys button{border:0;background:none;color:var(--wx-link);font-size:12px;padding:0 2px}
.typing{padding:2px 0 10px 62px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--wx-sub);animation:wv 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.chat-bar{flex:none;background:var(--wx-bar);border-top:.5px solid var(--wx-line);padding:8px 8px 28px}
.chat-bar.open{padding-bottom:0}
.bar-row{display:flex;align-items:flex-end;gap:4px}
.bar-row .ib{color:var(--wx-text);height:40px}
.ci{flex:1;min-width:0;resize:none;border:0;border-radius:6px;background:var(--wx-input);color:var(--wx-text);font-size:16px;line-height:22px;padding:9px 10px;height:40px;max-height:110px;outline:none;box-sizing:border-box;margin:0;-webkit-user-select:text;user-select:text}
.hold{flex:1;height:40px;border:0;border-radius:6px;background:var(--wx-input);font-weight:600;font-size:15px;touch-action:none;-webkit-touch-callout:none}
.hold.active{background:var(--wx-line)}
.send{border:0;border-radius:6px;background:var(--wx-green);color:var(--on-pri);height:36px;padding:0 14px;font-size:15px;margin:0 2px 2px 4px;flex:none}
.quote-chip{display:flex;align-items:center;gap:6px;margin:0 50px 6px 46px;background:var(--wx-quote);color:var(--wx-sub);border-radius:4px;padding:2px 2px 2px 10px;font-size:12px}
.quote-chip span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{height:236px;margin-top:8px;border-top:.5px solid var(--wx-line);box-sizing:border-box;padding-bottom:26px;display:flex;flex-direction:column}
.p-tabs{display:flex;gap:4px;padding:8px 10px 0}
.p-tabs button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--wx-sub)}
.p-tabs button.on{background:var(--wx-card);color:var(--wx-text)}
.emo-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);padding:6px 8px;align-content:start}
.emo-grid button{border:0;background:none;font-size:26px;height:44px;border-radius:8px;padding:0}
.emo-grid button:active{background:var(--wx-press)}
.emo-grid.stk{grid-template-columns:repeat(4,1fr)}
.emo-grid.stk button{font-size:44px;height:70px}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;padding:18px 12px 0}
.plus-grid button{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;font-size:12px;color:var(--wx-sub);padding:0}
.plus-grid span{width:58px;height:58px;border-radius:16px;background:var(--wx-card);display:grid;place-items:center;color:var(--wx-text)}
.plus-grid svg{width:26px;height:26px}
.bmenu{position:absolute;z-index:93;background:var(--menu);color:var(--on-color);border-radius:8px;display:flex;flex-wrap:wrap;padding:4px;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bmenu button{width:52px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;font-size:11px;color:inherit;border-radius:6px}
.bmenu button:active{background:rgba(255,255,255,.12)}
.bmenu svg{width:20px;height:20px}
.rec{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:168px;padding:18px 12px 14px;border-radius:14px;background:var(--toast);color:var(--on-color);z-index:94;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;text-align:center}
.rec.cancel{background:var(--rp-deep)}
.rec .lv{display:flex;gap:3px;align-items:flex-end;height:30px}
.rec .lv i{width:4px;border-radius:2px;background:currentColor;animation:lv .9s infinite ease-in-out}
@keyframes lv{0%,100%{height:6px}50%{height:28px}}
.rec .sec{font:300 28px/1 var(--display);font-variant-numeric:tabular-nums}

/* red packet modal */
.rp-open{position:absolute;left:40px;right:40px;top:50%;transform:translateY(-50%) scale(.9);opacity:0;transition:transform .3s,opacity .3s;z-index:91;height:440px;max-height:76%;background:var(--rp);border-radius:14px;color:var(--gold);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.rp-open.show{transform:translateY(-50%);opacity:1}
.rp-open::before{content:"";position:absolute;left:-30%;right:-30%;top:-40%;height:96%;border-radius:0 0 50% 50%;background:var(--rp-deep);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.rp-open > *{position:relative}
.rp-open .from{margin-top:56px;display:flex;align-items:center;gap:8px;font-size:15px}
.rp-open .wish{margin-top:16px;font-size:21px;padding:0 20px;text-align:center;line-height:1.4}
.rp-kai{position:absolute;left:50%;top:56%;width:96px;height:96px;margin-left:-48px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);font:600 40px/1 var(--serif);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.rp-kai.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.rp-open .x{position:absolute;top:10px;left:10px;color:var(--gold)}
.rp-open .more{position:absolute;bottom:18px;font-size:13px;opacity:.85}
.rp-res{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.rp-res .amt{font:300 48px/1.1 var(--display);color:var(--rp-deep);font-variant-numeric:tabular-nums}
.rp-res .amt small{font-size:16px;margin-left:4px}
.rp-res p{margin:0;font-size:13px;color:var(--sheet-sub)}

/* call */
.call{position:absolute;inset:0;z-index:95;background:var(--call);color:var(--on-color);display:flex;flex-direction:column;align-items:center;padding-top:120px;box-sizing:border-box;overflow:hidden}
.call .bgav{position:absolute;inset:-20%;filter:blur(60px);opacity:.45}
.call > *{position:relative}
.call .nm{font-size:24px;font-weight:600;margin-top:18px}
.call .st{font-size:14px;color:var(--call-sub);margin-top:8px;font-variant-numeric:tabular-nums}
.call .self{position:absolute;top:60px;right:16px;width:92px;height:136px;border-radius:12px;background:var(--rp-deep);overflow:hidden;display:grid;place-items:center}
.call-btns{position:absolute;bottom:60px;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);justify-items:center}
.call-btns button{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;font-size:12px;color:var(--call-sub)}
.call-btns span{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:var(--on-color)}
.call-btns .on span{background:#FFFFFF;color:var(--call)}
.call-btns .hang span{background:var(--wx-red)}
.call-btns .hang svg{transform:rotate(135deg)}

/* moments */
.mo-cover{height:250px;position:relative;margin-bottom:44px;background:linear-gradient(170deg,#EADFD2,#D9C3B0 60%,#C7AA93);flex:none}
.mo-cover .who{position:absolute;right:16px;bottom:-26px;display:flex;gap:14px;align-items:flex-start}
.mo-cover .who b{color:var(--on-color);font-size:18px;margin-top:20px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.mo-post{display:flex;gap:10px;padding:16px 16px 14px;border-top:.5px solid var(--wx-line);background:var(--wx-card)}
.mo-c{flex:1;min-width:0}
.mo-name{color:var(--wx-link);font-weight:600;font-size:15px;border:0;background:none;padding:0}
.mo-text{font-size:15px;margin:3px 0 8px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.mo-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:236px}
.mo-imgs.one{grid-template-columns:1fr;max-width:180px}
.mo-imgs.two{grid-template-columns:1fr 1fr;max-width:158px}
.mo-imgs div{line-height:0;cursor:zoom-in;aspect-ratio:1;overflow:hidden}
.mo-imgs.one div{aspect-ratio:4/3}
.mo-imgs svg{width:100%;height:100%;display:block}
.mo-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--wx-sub);margin-top:8px;position:relative}
.mo-act{width:34px;height:22px;border-radius:4px;border:0;background:var(--wx-quote);color:var(--wx-link);display:grid;place-items:center;padding:0}
.mo-pop{position:absolute;right:42px;top:50%;transform:translateY(-50%);background:var(--menu);color:var(--on-color);border-radius:6px;display:flex;overflow:hidden}
.mo-pop button{display:flex;align-items:center;gap:6px;padding:9px 16px;border:0;background:none;color:inherit;font-size:13px}

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const WEEK = ['日','一','二','三','四','五','六'];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dayOff = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const rand = a => a[Math.floor(Math.random()*a.length)];
const money = n => Number(n).toFixed(2);
const DAY = 864e5;
function refs(el){ const r = {}; el.querySelectorAll('[data-ref]').forEach(n => r[n.dataset.ref] = n); return r; }
function fmtList(t){
  const d = new Date(t), today = sod(Date.now());
  if (t >= today) return hm(d);
  if (t >= today - DAY) return '昨天';
  if (t >= today - 6*DAY) return '星期' + WEEK[d.getDay()];
  if (d.getFullYear() === new Date().getFullYear()) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function fmtMsg(t){ const s = fmtList(t), d = new Date(t); return t >= sod(Date.now()) ? s : `${s} ${hm(d)}`; }
function fmtAgo(t){
  const m = Math.floor((Date.now()-t)/6e4);
  if (m < 1) return '刚刚'; if (m < 60) return m + '分钟前';
  const h = Math.floor(m/60); if (h < 24) return h + '小时前';
  const d = Math.floor(h/24); return d === 1 ? '昨天' : d + '天前';
}

const screen = $('#screen'), layers = $('#layers'), home = $('#home'), sb = $('#sb'), homeBar = $('#homeBar');
const stack = [];
let overlaySb = null;
function mkPage(cls, sbVar){ const el = document.createElement('div'); el.className = 'page ' + cls; return {el, sb:sbVar}; }
function push(p, anim='slide'){
  p.anim = anim;
  p.el.classList.add('in-' + anim);
  layers.appendChild(p.el);
  const prev = stack[stack.length-1];
  stack.push(p);
  p.refresh && p.refresh();
  void p.el.offsetWidth;
  p.el.classList.remove('in-' + anim);
  if (prev && anim === 'slide') prev.el.classList.add('behind');
  home.classList.add('dim');
  syncChrome();
  p.mounted && p.mounted();
}
function pop(){
  closeTransient();
  const p = stack.pop(); if (!p) return;
  p.leave && p.leave();
  p.el.style.pointerEvents = 'none';
  p.el.classList.add('in-' + p.anim);
  setTimeout(() => p.el.remove(), 380);
  const top = stack[stack.length-1];
  if (top){ top.el.classList.remove('behind'); top.refresh && top.refresh(); }
  else { home.classList.remove('dim'); renderHome(); }
  syncChrome();
}
function goHome(){
  closeTransient();
  if (!stack.length) return;
  const all = stack.splice(0);
  all.forEach((p, i) => {
    p.leave && p.leave();
    if (i === all.length-1){ p.el.style.pointerEvents='none'; p.el.classList.remove('behind'); p.el.classList.add('in-app'); setTimeout(() => p.el.remove(), 380); }
    else p.el.remove();
  });
  home.classList.remove('dim'); renderHome(); syncChrome();
}
function syncChrome(){
  const top = stack[stack.length-1];
  const v = overlaySb || (top ? top.sb : '--home-ink');
  sb.style.color = `var(${v})`;
  homeBar.style.color = `var(${v})`;
}
function refreshAll(){ stack.forEach(p => p.refresh && p.refresh()); if (!stack.length) renderHome(); }

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;

});

/* transient: popmenus, bubble menus */
function closeTransient(all){

function overlay(build){
  closeTransient();
  const mask = document.createElement('div'); mask.className = 'mask';
  screen.appendChild(mask);
  const box = build();
  screen.appendChild(box);
  void box.offsetWidth;
  mask.classList.add('show'); box.classList.add('show');
  const close = () => { mask.classList.remove('show'); box.classList.remove('show'); setTimeout(() => { mask.remove(); box.remove(); }, 300); };
  mask._close = close;
  mask.addEventListener('click', close);

}

  });

}

function bindLong(root, sel, fn){
  let timer = null, sx = 0, sy = 0, target = null, fired = false;
  const cancel = () => { clearTimeout(timer); timer = null; if (target) target.classList.remove('pressing'); target = null; };
  root.addEventListener('pointerdown', e => {
    fired = false;
    const t = e.target.closest(sel); if (!t || !root.contains(t) || e.button > 0) return;
    target = t; sx = e.clientX; sy = e.clientY; t.classList.add('pressing');
    timer = setTimeout(() => { fired = true; const tt = target; cancel(); fn(tt); }, 480);
  });
  root.addEventListener('pointermove', e => { if (target && (Math.abs(e.clientX-sx) > 8 || Math.abs(e.clientY-sy) > 8)) cancel(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => root.addEventListener(ev, cancel));
  root.addEventListener('contextmenu', e => { const t = e.target.closest(sel); if (t && root.contains(t)) { e.preventDefault(); cancel(); fn(t); } });
  root.addEventListener('click', e => { if (fired){ fired = false; e.stopPropagation(); e.preventDefault(); } }, true);
}
function posMenu(menu, anchor){
  const sr = screen.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
  screen.appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = ar.left - sr.left + ar.width/2 - mw/2;
  left = Math.max(8, Math.min(left, sr.width - mw - 8));
  let top = ar.top - sr.top - mh - 8;
  if (top < 96) top = ar.bottom - sr.top + 8;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
}

function openChatFromAnywhere(id){
  const top = stack[stack.length-1];
  if (top && top.chatId === id) return;
  if (!stack.some(p => p.el.classList.contains('wx') && p.tab)) { goHome(); push(pageWechat(), 'app'); }
  else { while (stack.length && !stack[stack.length-1].tab) { const p = stack.pop(); p.leave && p.leave(); p.el.remove(); } stack[stack.length-1].el.classList.remove('behind'); }
  openChat(id);
}

/* ================= WeChat: chat ================= */
const TYPING = new Map();
const TIMERS = new Map();
const EMOJI = '😀 😁 😂 🤣 😊 😍 🥰 😘 😜 🤔 🙄 😴 😭 😤 😡 🥺 🤗 🙈 😎 🤤 😳 😅 🙃 😇 🫠 🥹 👍 👌 🙏 👏 💪 🎉 ❤️ 💔 🌹 ☕ 🍜 🍰 🌙 ☀️'.split(' ');

function openChat(id){
  const chat = getChat(id); if (!chat) return;
  chat.unread = 0; save();
  const p = mkPage('wx chat-page', '--wx-text'); p.chatId = id;
  p.mode = 'text'; p.panel = null; p.quote = null; p.stkTab = false;
  const el = p.el;
  el.innerHTML = `<header class="nav"><div class="nav-l"><button class="ib back" data-act="pop" aria-label="返回">${I.back}<span data-ref="backn"></span></button></div><div class="nav-t" data-ref="title"></div><div class="nav-r"><button class="ib" data-act="info" aria-label="聊天信息">${I.more}</button></div></header>
    <div class="chat-scroll" data-ref="scroll"><div data-ref="msgs"></div><div data-ref="typing"></div></div>
    <div class="chat-bar" data-ref="bar">
      <div class="quote-chip" data-ref="qchip" hidden><span data-ref="qtext"></span><button class="ib sm" data-act="unquote" aria-label="取消引用">${sm('close',14)}</button></div>
      <div class="bar-row">
        <button class="ib" data-act="mode" data-ref="modeBtn" aria-label="切换语音">${I.voice}</button>

        <button class="hold" data-ref="hold" hidden>按住 说话</button>
        <button class="ib" data-act="emoji" data-ref="emoBtn" aria-label="表情">${I.smile}</button>
        <button class="ib" data-act="plus" data-ref="plusBtn" aria-label="更多功能">${I.plusc}</button>
        <button class="send" data-act="send" data-ref="sendBtn" hidden>发送</button>
      </div>
      <div class="panel" data-ref="emoPanel" hidden><div class="p-tabs"><button data-act="emotab" data-k="0" class="on">表情</button><button data-act="emotab" data-k="1">贴纸</button></div><div class="emo-grid" data-ref="emoGrid"></div></div>
      <div class="panel" data-ref="plusPanel" hidden><div class="plus-grid">
        ${[['album','相册','image'],['camera','拍摄','camera'],['video','视频通话','video'],['audio','语音通话','phone'],['loc','位置','pin'],['rp','红包','rp'],['tf','转账','tf'],['card','个人名片','card']].map(([k,l,i]) => `<button data-plus="${k}"><span>${ic(P[i])}</span>${l}</button>`).join('')}
      </div></div>
    </div>`;
  const R = refs(el);
  R.input.value = chat.draft || '';
  const nearBottom = () => R.scroll.scrollHeight - R.scroll.scrollTop - R.scroll.clientHeight < 80;
  const toBottom = () => { R.scroll.scrollTop = R.scroll.scrollHeight; };
  function header(){
    const typing = TYPING.get(id);
    const t = chatName(chat) + (chat.type === 'group' ? `(${chat.members.length})` : '');
    R.title.innerHTML = (typing && chat.type === 'single') ? '对方正在输入…' : esc(t) + (chat.muted ? ` <span style="opacity:.5;vertical-align:-2px">${sm('bell',14)}</span>` : '');
    const others = S.chats.filter(c => c.id !== id).reduce((s,c) => s + (c.muted ? 0 : c.unread||0), 0);
    R.backn.textContent = others ? others : '';
  }
  function renderMsgs(stick){
    const keep = stick || nearBottom();
    let html = '', last = 0;
    chat.msgs.forEach((m, i) => {
      if (m.t - last > 5*6e4) html += `<div class="msg-time">${fmtMsg(m.t)}</div>`;
      last = m.t;
      html += msgHtml(chat, m, i);
    });
    if (!chat.msgs.length) html = `<div class="msg-sys" style="padding-top:30px">${chat.with === 'file' ? '在手机和电脑之间传文件，或者给自己留个言' : '还没有消息，打个招呼吧'}</div>`;
    R.msgs.innerHTML = html;
    const typing = TYPING.get(id);
    R.typing.innerHTML = typing ? `<div class="typing" title="${esc(nameOf(typing))} 正在输入"><i></i><i></i><i></i></div>` : '';
    if (keep) toBottom();
  }
  p.refresh = () => { chat.unread = 0; header(); renderMsgs(); };
  p.onIncoming = () => { header(); renderMsgs(); };
  p.mounted = () => { toBottom(); };
  p.leave = () => { chat.draft = R.input.value.trim() ? R.input.value : ''; save(); };

  /* input / panels */
  function autosize(){ R.input.style.height = '40px'; R.input.style.height = Math.min(110, R.input.scrollHeight) + 'px'; }
  function syncBtns(){ const has = R.input.value.trim().length > 0 && p.mode === 'text'; R.sendBtn.hidden = !has; R.plusBtn.hidden = has; }
  function setPanel(k){
    p.panel = p.panel === k ? null : k;

  };
  R.hold.addEventListener('pointerup', finishRec);

  /* avatar click / double-click */
  let avT = null;

  function pat(uidp){
    const who = uidp === 'me' ? '自己' : `"${nameOf(uidp)}"`;
    chat.msgs.push({id:uid(), from:'sys', type:'system', text:`我拍了拍${who}`, t:Date.now()}); save();

  el.addEventListener('click', e => {

      case 'emoji': setPanel('emoji'); break;
      case 'plus': setPanel('plus'); break;
      case 'emotab': p.stkTab = t.dataset.k === '1'; renderEmo(); break;
      case 'send': sendText(); break;
      case 'unquote': setQuote(null); break;
      case 'reedit': { const mm = chat.msgs[+t.dataset.i]; if (mm){ setMode('text', true); R.input.value = mm.reedit; autosize(); syncBtns(); R.input.focus(); } break; }
      case 'voice': playVoice(t, m); break;
      case 'img': viewImage(m.img); break;
      case 'rp': openRedPacket(chat, m, () => renderMsgs()); break;
      case 'tf': openTransfer(chat, m, () => renderMsgs(true)); break;
      case 'card': push(pageProfile(m.uid)); break;
      case 'loc': toast(`${m.name}\n${m.addr}`); break;
      case 'call': startCall(chat, m.kind); break;
    }
  });
  function playVoice(b, m){
    if (b.classList.contains('playing')){ b.classList.remove('playing'); clearTimeout(b._t); return; }
    R.msgs.querySelectorAll('.b-voice.playing').forEach(n => { n.classList.remove('playing'); clearTimeout(n._t); });
    b.classList.add('playing');
    if (!m.played){ m.played = true; save(); const d = b.parentElement.querySelector('.v-dot'); if (d) d.remove(); }
    b._t = setTimeout(() => b.classList.remove('playing'), m.dur*1000);
  }
  function plusAct(k){
    if (k === 'album') return pickPhoto(key => send({type:'image', img:key}));
    if (k === 'camera'){ const fl = $('#flash'); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 60); setTimeout(() => send({type:'image', img:rand(Object.keys(PHOTOS))}), 300); return; }
    if (k === 'video' || k === 'audio'){ if (chat.type === 'group' || chat.with === 'file') return toast('这里不能发起通话'); return startCall(chat, k === 'video' ? 'video' : 'voice'); }
    if (k === 'loc') return sheet({title:'发送位置', items: PLACES.map(pl => ({label:pl.name, act:() => send({type:'location', ...pl})}))});
    if (k === 'card') return sheet({title:'选择要发送的名片', items:Object.keys(S.contacts).filter(i => !S.contacts[i].sys && i !== chat.with).map(i => ({label:nameOf(i), act:() => send({type:'card', uid:i})}))});
    if (k === 'rp') return formModal({title: chat.type === 'group' ? '发红包到群聊' : '发红包', ok:'塞钱进红包', okCls:'red', fields:[{id:'amt', label:`金额（元，零钱 ¥${money(S.wallet)}）`, type:'number', step:'0.01', ph:'0.00'},{id:'wish', label:'祝福语', ph:'恭喜发财，大吉大利', max:24}], submit(v){
      const a = Math.round(parseFloat(v.amt)*100)/100;
      if (!(a > 0)) return '请输入红包金额';
      if (a > 200) return '单个红包金额不能超过 200 元';
      if (a > S.wallet) return '零钱余额不足';
      addTxn('发出红包', -a);
      send({type:'redpacket', amount:a, wish:v.wish || '恭喜发财，大吉大利', opened:false});
    }});
    if (k === 'tf'){
      if (chat.type === 'group') return toast('群聊里请发红包');
      if (chat.with === 'file') return toast('不能给文件传输助手转账');
      return formModal({title:`转账给 ${nameOf(chat.with)}`, ok:'转账', fields:[{id:'amt', label:`金额（元，零钱 ¥${money(S.wallet)}）`, type:'number', step:'0.01', ph:'0.00'},{id:'note', label:'转账说明（选填）', ph:'添加转账说明', max:20}], submit(v){
        const a = Math.round(parseFloat(v.amt)*100)/100;
        if (!(a > 0)) return '请输入转账金额';
        if (a > S.wallet) return '零钱余额不足';
        addTxn('转账给-' + nameOf(chat.with), -a);
        send({type:'transfer', amount:a, note:v.note, status:'pending'});
      }});
    }
  }

  /* long press menu on bubbles */
  bindLong(el, '.msg [data-press]', node => {
    const row = node.closest('.msg'); const i = +row.dataset.i; const m = chat.msgs[i]; if (!m) return;
    const opts = [];
    if (m.type === 'text') opts.push(['copy','复制']);
    if (m.type === 'voice') opts.push(['tx', m.showTx ? '收起文字' : '转文字']);
    if (['text','image','voice','sticker','location','card'].includes(m.type)) opts.push(['quote','引用']);
    if (m.from === 'me' && !['redpacket','transfer','call'].includes(m.type)) opts.push(['recall','撤回']);
    opts.push(['del','删除']);
    const icons = {copy:'copy', tx:'text', quote:'quote', recall:'undo', del:'trash'};
    const menu = document.createElement('div'); menu.className = 'bmenu';
    menu.innerHTML = opts.map(([k,l]) => `<button data-k="${k}">${ic(P[icons[k]])}<span>${l}</span></button>`).join('');
    posMenu(menu, node);
    menu.addEventListener('click', ev => {
      const b = ev.target.closest('[data-k]'); if (!b) return; menu.remove();
      const k = b.dataset.k;
      if (k === 'copy'){
        try { navigator.clipboard.writeText(m.text).then(() => toast('已复制'), () => toast('复制失败，可以在输入框里手动粘贴')); } catch(_) { toast('复制失败'); }
      } else if (k === 'tx'){ m.showTx = !m.showTx; save(); renderMsgs(); }
      else if (k === 'quote'){ setMode('text', true); setQuote(m); }
      else if (k === 'recall'){
        chat.msgs[i] = {id:m.id, from:'sys', type:'recall', text:'你撤回了一条消息', reedit: m.type === 'text' ? m.text : '', t:m.t}; save(); renderMsgs();
      } else if (k === 'del'){
        confirmSheet('删除这条消息？只会在你的手机上删除', '删除', () => { chat.msgs.splice(i,1); save(); renderMsgs(); });
      }
    });
  });

  setMode('text', true); syncBtns(); autosize();
  push(p);
  return p;
}

};
function genReply(rid, trig){
  const per = PERSONA[rid] || PERSONA._;
  if (trig.type === 'image') return {type:'text', text:rand(['好看！','这是哪儿？','拍得真好','发我原图'])};
  if (trig.type === 'voice') return {type:'text', text:rand(['我刚听了','嗯嗯好','听到啦','等下回你'])};
  if (trig.type === 'sticker') return Math.random() < .5 ? {type:'sticker', emo:rand(STICKERS)} : {type:'text', text:rand(['哈哈哈','可爱','？？'])};
  if (trig.type === 'location') return {type:'text', text:rand(['收到，我过去找你','好，我看看怎么走','离我挺近的'])};
  if (trig.type === 'card') return {type:'text', text:'好，我加一下'};
  if (trig.type === 'call') return {type:'text', text:rand(['刚才信号不太好','嗯，那就这么说定了','好，挂啦'])};
  const txt = trig.text || '';
  for (const [re, arr] of per.kw) if (re.test(txt)) return {type:'text', text:rand(arr)};
  if (/[?？]$/.test(txt) && Math.random() < .5) return {type:'text', text:rand(['让我想想','应该是吧','你觉得呢？','嗯，是的'])};
  return {type:'text', text:rand(per.base)};
}
function setTyping(chat, rid){ if (rid) TYPING.set(chat.id, rid); else TYPING.delete(chat.id); refreshChatViews(chat); }
function refreshChatViews(chat){
  stack.forEach(p => { if (p.chatId === chat.id) p.onIncoming(); else if (p.tab) p.refresh(); });
}
function addIncoming(chat, m){
  chat.msgs.push(m);
  const top = stack[stack.length-1];
  const viewing = top && top.chatId === chat.id;
  if (!viewing && m.from !== 'sys'){ chat.unread = (chat.unread||0) + 1; if (!chat.muted) banner(chat, m); }
  save();
  refreshChatViews(chat);
  if (!stack.length) renderHome();
}
function scheduleReply(chat, trig){
  if (chat.with === 'file') return;
  (TIMERS.get(chat.id) || []).forEach(clearTimeout);
  const timers = []; TIMERS.set(chat.id, timers);
  TYPING.delete(chat.id);
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const members = chat.type === 'group' ? chat.members.filter(x => x !== 'me') : [chat.with];
  const responders = chat.type === 'group' ? [...members].sort(() => Math.random() - .5).slice(0, 1 + (Math.random() < .5 ? 1 : 0)) : [chat.with];
  let at = 900;
  responders.forEach(rid => {
    if (!person(rid)) return;
    const slow = (PERSONA[rid] || {}).slow;
    // side effects for money
    if (trig.type === 'redpacket' && trig.from === 'me'){
      later(() => { trig.opened = true; addIncoming(chat, {id:uid(), from:'sys', type:'system', text:`${nameOf(rid)}领取了你的红包`, t:Date.now()}); }, at + 600);
      at += 900;
    }
    if (trig.type === 'transfer' && trig.from === 'me' && chat.type === 'single'){
      later(() => { trig.status = 'received'; addIncoming(chat, {id:uid(), from:rid, type:'transfer', amount:trig.amount, receipt:true, t:Date.now()}); }, at + 900);
      at += 1200;
    }
    const n = Math.random() < .3 ? 2 : 1;
    for (let k = 0; k < n; k++){
      let r = genReply(rid, trig);
      if (trig.type === 'redpacket' && k === 0) r = {type:'text', text:rand(['谢谢老板！','红包收到啦～','哇，谢谢！'])};
      if (trig.type === 'transfer' && k === 0) r = {type:'text', text:rand(['收到啦，谢谢','这么客气干嘛','好，收下了'])};
      const typeAt = at + (slow ? 2500 : 0);
      const dur = 900 + Math.min(2600, (r.text || '').length * 110);
      later(() => setTyping(chat, rid), typeAt);
      at = typeAt + dur;
      later(() => { setTyping(chat, null); addIncoming(chat, Object.assign(r, {id:uid(), from:rid, t:Date.now()})); }, at);
      at += 500;
    }
  });
}

function openTransfer(chat, m, after){
  const mine = m.from === 'me';
  if (m.receipt || m.status === 'received' || mine){
    const st = m.receipt ? '已收款' : m.status === 'received' ? (mine ? '对方已收款' : '你已收款') : '待对方确认收款';

function startCall(chat, kind){
  closeTransient();
  const rid = chat.with;
  const el = document.createElement('div'); el.className = 'call';
  el.innerHTML = `<div class="bgav" style="background:${esc(person(rid).color)}"></div>
    ${kind === 'video' ? `<div class="self">${av('me',56)}</div>` : ''}
    ${av(rid, 96)}<div class="nm">${esc(nameOf(rid))}</div><div class="st" data-st>${kind === 'video' ? '正在等待对方接受邀请…' : '正在呼叫…'}</div>
    <div class="call-btns">
      <button data-c="mute"><span>${ic(P.mic,28)}</span>${kind === 'video' ? '麦克风已开' : '静音'}</button>
      <button class="hang" data-c="hang"><span>${ic(P.phone,30)}</span>${'挂断'}</button>
      <button data-c="third"><span>${ic(kind === 'video' ? P.flip : P.speaker,28)}</span>${kind === 'video' ? '翻转镜头' : '免提'}</button>
    </div>`;
  screen.appendChild(el); overlaySb = '--on-color'; syncChrome();
  let start = 0, iv = null;
  const st = el.querySelector('[data-st]');
  const conn = setTimeout(() => { start = Date.now(); iv = setInterval(() => { const s = Math.floor((Date.now()-start)/1000); st.textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`; }, 250); st.textContent = '00:00'; }, 2400);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    if (b.dataset.c === 'hang'){
      clearTimeout(conn); clearInterval(iv);
      const s = start ? Math.max(1, Math.floor((Date.now()-start)/1000)) : 0;
      st.textContent = '通话结束';
      setTimeout(() => {
        el.remove(); overlaySb = null; syncChrome();
        const m = {id:uid(), from:'me', type:'call', kind, text: s ? `通话时长 ${pad(Math.floor(s/60))}:${pad(s%60)}` : '已取消', t:Date.now()};
        chat.msgs.push(m); save(); refreshChatViews(chat);
        if (s) scheduleReply(chat, m);
      }, 500);
    } else {

function pageMoments(onlyId){
  const p = mkPage('wx', '--wx-text');

  p.refresh = () => {
    const owner = onlyId || 'me';

      (posts.length ? posts.map(postHtml).join('') : '<div class="empty">还没有发过朋友圈</div>') + '<div style="height:30px"></div>';
  };
  function postHtml(m){
    const n = m.imgs.length;
    return `<div class="mo-post" data-post="${m.id}">${av(m.from,42)}<div class="mo-c">
      <button class="mo-name" data-profile="${m.from}">${esc(m.from === 'me' ? S.me.name : nameOf(m.from))}</button>
      ${m.text ? `<div class="mo-text">${esc(m.text)}</div>` : '<div style="height:6px"></div>'}
      ${n ? `<div class="mo-imgs ${n===1?'one':n===2||n===4?'two':''}">${m.imgs.map(k => `<div data-img="${k}">${photo(k)}</div>`).join('')}</div>` : ''}
      <div class="mo-meta"><span>${fmtAgo(m.t)}${m.from === 'me' ? ` · <button data-act="delpost" style="border:0;background:none;color:var(--wx-link);font-size:12px;padding:0">删除</button>` : ''}</span><button class="mo-act" data-act="pop2" aria-label="点赞或评论">${ic('<circle cx="8" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="currentColor"/>',18)}</button></div>
      ${m.likes.length || m.comments.length ? `<div class="mo-fb">${m.likes.length ? `<div class="mo-likes">${sm('heart',13)}<span>${m.likes.map(x => esc(x === 'me' ? S.me.name : nameOf(x))).join('，')}</span></div>` : ''}${m.comments.map((c,ci) => `<div class="mo-cm" data-ci="${ci}"><b>${esc(c.from === 'me' ? S.me.name : nameOf(c.from))}</b>${c.to ? `回复<b>${esc(c.to === 'me' ? S.me.name : nameOf(c.to))}</b>` : ''}：${esc(c.text)}</div>`).join('')}</div>` : ''}
    </div></div>`;
  }
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-img],[data-profile],.mo-cm'); if (!t) return;
    if (t.dataset.img) return viewImage(t.dataset.img);
    if (t.dataset.profile) return push(pageProfile(t.dataset.profile));
    const post = S.moments.find(m => m.id === t.closest('[data-post]')?.dataset.post);
    if (t.classList.contains('mo-cm')){ const c = post.comments[+t.dataset.ci]; if (c.from !== 'me') openComment(post, c.from); return; }
    const a = t.dataset.act;
    if (a === 'pop') pop();
    else if (a === 'post') push(pageCompose(p));
    else if (a === 'delpost') confirmSheet('删除这条朋友圈？', '删除', () => { S.moments = S.moments.filter(m => m !== post); save(); p.refresh(); });
    else if (a === 'pop2'){
      if (t.parentElement.querySelector('.mo-pop')) { closeTransient(); return; }
      closeTransient();
      const liked = post.likes.includes('me');
      const pp = document.createElement('div'); pp.className = 'mo-pop';
      pp.innerHTML = `<button data-act="like">${sm('heart',15)}${liked ? '取消' : '赞'}</button><button data-act="cmt">${sm('comment',15)}评论</button>`;
      t.parentElement.appendChild(pp);
    }
    else if (a === 'like'){ const i = post.likes.indexOf('me'); i >= 0 ? post.likes.splice(i,1) : post.likes.push('me'); save(); p.refresh(); }
    else if (a === 'cmt'){ closeTransient(); openComment(post, null); }
    else if (a === 'cm') sendComment();
  });
  function openComment(post, to){
    cmTarget = {post, to}; R.bar.hidden = false;
    R.input.placeholder = to ? `回复${nameOf(to)}：` : '评论'; R.input.focus();
  }
  function sendComment(){
    const v = R.input.value.trim(); if (!v || !cmTarget) return;
    const {post, to} = cmTarget;
    post.comments.push({from:'me', to: to || undefined, text:v}); save();
    R.input.value = ''; R.bar.hidden = true; cmTarget = null; p.refresh();
    if (post.from !== 'me' && Math.random() < .8){
      setTimeout(() => { post.comments.push({from:post.from, to:'me', text:rand(['哈哈是吧','谢谢～','下次带你一起','嗯嗯！','你也是'])}); save(); stack.includes(p) && p.refresh(); }, 2500);
    }
  }

function pageCompose(mp){

    S.moments.push(post); save(); pop();

function pageDiaryView(id){

function pageDiaryEdit(id, date){
  const p = mkPage('dy', '--d-ink');

/* ================= Calendar ================= */
const FEST = {'01-01':'元旦','02-14':'情人节','03-08':'妇女节','04-01':'愚人节','05-01':'劳动节','05-04':'青年节','06-01':'儿童节','07-01':'建党节','08-01':'建军节','09-10':'教师节','10-01':'国庆节','10-31':'万圣夜','11-11':'双十一','12-24':'平安夜','12-25':'圣诞节'};
const EVCOLORS = ['#D78C7A','#D9B27E','#9DB39A','#93A8C4','#C99AA4','#A9A29B'];
function pageCalendar(){
  const p = mkPage('cal', '--c-text');
  const now = new Date();
  p.y = now.getFullYear(); p.m = now.getMonth(); p.sel = ymd(now);
  p.refresh = () => {
    const today = ymd(new Date());
    const first = new Date(p.y, p.m, 1);
    const off = (first.getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < 42; i++){ const d = new Date(p.y, p.m, 1 - off + i); cells.push(d); }
    const rows = cells.slice(35).every(d => d.getMonth() !== p.m) ? 35 : 42;
    const evBy = {}; S.events.forEach(e => (evBy[e.date] = evBy[e.date] || []).push(e));
    const dyBy = {}; S.diary.forEach(d => dyBy[d.date] = d);
    const evs = (evBy[p.sel] || []).sort((a,b) => (a.time||'').localeCompare(b.time||''));
    const sd = parseYmd(p.sel), dy = dyBy[p.sel];
    const diff = Math.round((sod(sd) - sod(new Date()))/DAY);
    const rel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : diff > 0 ? `${diff} 天后` : `${-diff} 天前`;
    p.el.innerHTML = `<header class="nav"><div class="nav-l"><button class="ib" data-act="pop" aria-label="返回桌面">${I.back}</button></div><div class="nav-t"></div><div class="nav-r"><button class="txtbtn" data-act="today">今天</button></div></header>
      <div class="cal-head"><h1><small>${p.y} 年</small>${p.m+1} 月</h1><div class="arr"><button class="ib" data-act="prev" aria-label="上个月">${I.back}</button><button class="ib" data-act="next" aria-label="下个月">${I.chev}</button></div></div>
      <div class="cal-week">${['一','二','三','四','五','六','日'].map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">${cells.slice(0, rows).map(d => {
        const k = ymd(d), e = evBy[k] || [], f = FEST[k.slice(5)];
        const cls = [d.getMonth() !== p.m ? 'out' : '', k === today ? 'today' : '', k === p.sel ? 'sel' : '', (d.getDay() % 6 === 0) ? 'we' : ''].join(' ');
        return `<button class="cd ${cls}" data-d="${k}"><span class="n">${d.getDate()}</span><span class="lb">${f ? f : ''}</span><span class="ds">${e.slice(0,3).map(x => `<i style="background:${esc(x.color)}"></i>`).join('')}${dyBy[k] ? '<i style="background:var(--c-sub);border-radius:1px"></i>' : ''}</span></button>`;
      }).join('')}</div>
      <div class="cal-ag"><div class="h"><b>${sd.getMonth()+1}月${sd.getDate()}日 星期${WEEK[sd.getDay()]}</b><span>${rel}${FEST[p.sel.slice(5)] ? ' · ' + FEST[p.sel.slice(5)] : ''}</span></div>
        ${evs.map(e => `<button class="ev" data-ev="${e.id}"><span class="tm">${esc(e.time || '全天')}</span><i style="background:${esc(e.color)}"></i><div><b>${esc(e.title)}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</div></button>`).join('')}
        ${dy ? `<button class="cal-dy" data-dy="${dy.id}"><span class="seal" style="position:static;width:40px;height:40px;font-size:15px;flex:none;transform:rotate(-10deg);border-color:var(--c-accent);color:var(--c-accent)">${esc(dy.mood.slice(0,2))}</span><div style="min-width:0"><div class="tt">${esc(dy.title || '无题')}</div><small>这天写了日记 · ${esc(dy.weather)}</small></div></button>` : ''}
        ${!evs.length && !dy ? `<div style="color:var(--c-sub);font-size:13px;padding:6px 2px">这天没有安排</div>` : ''}
        <button class="cal-add" data-act="add">＋ 新建日程</button>
        ${!dy && p.sel <= today ? `<button class="cal-add" data-act="writedy" style="border-style:dotted;color:var(--c-sub);border-color:var(--c-sub)">写这天的日记</button>` : ''}
      </div>`;
  };
  p.el.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-d],[data-ev],[data-dy]'); if (!t) return;
    if (t.dataset.d){ p.sel = t.dataset.d; const d = parseYmd(p.sel); p.y = d.getFullYear(); p.m = d.getMonth(); p.refresh(); return; }
    if (t.dataset.ev) return eventSheet(S.events.find(x => x.id === t.dataset.ev), p);
    if (t.dataset.dy) return push(pageDiaryView(t.dataset.dy));
    const a = t.dataset.act;
    if (a === 'pop') pop();
    else if (a === 'prev' || a === 'next'){ const d = new Date(p.y, p.m + (a === 'next' ? 1 : -1), 1); p.y = d.getFullYear(); p.m = d.getMonth(); p.refresh(); }
    else if (a === 'today'){ const d = new Date(); p.y = d.getFullYear(); p.m = d.getMonth(); p.sel = ymd(d); p.refresh(); }
    else if (a === 'add') eventForm(null, p);
    else if (a === 'writedy') push(pageDiaryEdit(null, p.sel));
  });
  return p;
}
function eventSheet(ev, p){

    {label:'编辑日程', act:() => eventForm(ev, p)},

    <div class="f-err" data-ref="err"></div>

      if (ev) Object.assign(ev, rec); else S.events.push(Object.assign({id:uid()}, rec));
      save(); close(); p.sel = rec.date; const d = parseYmd(rec.date); p.y = d.getFullYear(); p.m = d.getMonth(); p.refresh(); toast('已保存');
    };

      <div class="sg"><button class="row" style="min-height:78px;--indent:16px" data-act="me">${av('me',54)}<span class="lbl"><b style="font-size:18px;font-weight:600">${esc(S.me.name)}</b><br><span style="font-size:13px;color:var(--s-sub)">${esc(S.me.sign || '编辑个人资料')}</span></span><span class="chev">${sm('chev')}</span></button></div>
      <div class="sg-h">桌面壁纸</div>
      <div class="sg"><div class="walls">${WALLS.map(([k,l]) => `<button data-wall="${k}" class="${S.settings.wall===k?'on':''}" style="background:var(--wall-${k})" aria-label="${l}"><small>${l}</small></button>`).join('')}</div></div>
      <div class="sg-h">外观</div>
      <div class="sg"><div class="seg">${[['system','跟随系统'],['light','浅色'],['dark','深色']].map(([k,l]) => `<button data-look="${k}" class="${S.settings.look===k?'on':''}">${l}</button>`).join('')}</div></div>
      <div class="sg-h">数据</div>
      <div class="sg">
        <div class="row" style="--indent:16px;cursor:default"><span class="lbl">聊天</span><span class="val">${S.chats.length} 个 · ${S.chats.reduce((s,c)=>s+c.msgs.length,0)} 条消息</span></div>
        <div class="row" style="--indent:16px;cursor:default"><span class="lbl">日记 / 日程 / 备忘</span><span class="val">${S.diary.length} / ${S.events.length} / ${S.memos.length}</span></div>
        <button class="row" style="--indent:16px;color:var(--danger)" data-act="reset"><span class="lbl">恢复示例数据</span></button>
      </div>
      <div style="text-align:center;color:var(--s-sub);font-size:12px;line-height:1.8;padding:4px 20px">小手机 · 所有内容只保存在这个浏览器里</div>
      </div>`;
  };
  p.el.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-wall],[data-look]'); if (!t) return;
    if (t.dataset.wall){ S.settings.wall = t.dataset.wall; save(); p.refresh(); renderHome(); return; }
    if (t.dataset.look){ S.settings.look = t.dataset.look; save(); applyLook(); p.refresh(); return; }
    const a = t.dataset.act;
    if (a === 'pop') pop();
    else if (a === 'me') push(pageEditMe());
    else if (a === 'reset') confirmSheet('会清除你在小手机里的所有改动，换回示例内容', '恢复示例数据', () => {
      TIMERS.forEach(ts => ts.forEach(clearTimeout)); TIMERS.clear(); TYPING.clear();
      S = seed(); save(); applyLook(); goHome(); toast('已恢复示例数据');
    });
  });
  return p;
}

/* ================= boot ================= */
applyLook();
renderHome();
syncChrome();
// a gentle first message so the phone feels alive
setTimeout(() => {
  const c = getChat('c_shen');
  if (!c || S.greeted) return;
  S.greeted = true;
  addIncoming(c, {id:uid(), from:'shen', type:'text', text:'到公司了吗？', t:Date.now()});
}, 4000);
})();
</script>
