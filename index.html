<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>草莓小手机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p50:#fff7fa; --p100:#ffeef4; --p200:#ffdbe7; --p300:#ffc2d6; --p400:#ff9fbe; --p500:#f57fa5; --p600:#e0638c;
  --lav:#e9defc; --lav2:#c9b4f5; --mint:#d9f5ea; --cream:#fff6e8; --sky:#dcefff;
  --ink:#6b4553; --ink2:#a07d8b; --ink3:#c9aab6;
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.78); --line:rgba(245,127,165,.16);
  --shadow:0 8px 24px rgba(240,128,165,.16); --shadow-s:0 3px 10px rgba(240,128,165,.12);
  --r:22px;
  --wall:radial-gradient(circle at 15% 12%,#ffffff 0,transparent 32%),radial-gradient(circle at 88% 30%,#ffe0ef 0,transparent 38%),radial-gradient(circle at 25% 85%,#f3e6ff 0,transparent 40%),linear-gradient(165deg,#ffeef4 0%,#ffdbe8 50%,#fde8f5 100%);
  --font:"Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#fbe9ef;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:radial-gradient(#f7c9d8 1.2px,transparent 1.2px);background-size:22px 22px}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--ink);font-size:15px;outline:none}
::-webkit-scrollbar{display:none}

/* ---------- phone shell ---------- */
.phone{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--wall);
  box-shadow:0 0 0 10px #fff,0 0 0 12px #ffd3e1,0 30px 80px rgba(224,99,140,.35);isolation:isolate}
@media (max-width:500px){
  body{background:none}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:6px 30px 0;font-weight:700;font-size:15px;z-index:50;pointer-events:none}
.statusbar .r{display:flex;gap:6px;align-items:center}
.bat{width:24px;height:12px;border:1.6px solid currentColor;border-radius:4px;position:relative;padding:1.5px}
.bat i{display:block;height:100%;width:78%;background:currentColor;border-radius:1.5px}
.bat:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:5px;background:rgba(107,69,83,.35);z-index:60;cursor:pointer}
.homebar:before{content:"";position:absolute;inset:-14px -20px}

/* ---------- home ---------- */
.home{position:absolute;inset:0;padding:56px 22px 0;display:flex;flex-direction:column;transition:transform .35s,opacity .35s,filter .35s}
.home.dim{transform:scale(.92);opacity:.4;filter:blur(3px)}
.deco{position:absolute;pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(245,127,165,.4);font-size:18px;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8) rotate(15deg)}}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}
.w-clock{grid-column:span 2;border-radius:28px;padding:18px 20px;position:relative;overflow:hidden}
.w-clock .t{font-size:54px;font-weight:700;letter-spacing:1px;line-height:1;color:var(--p600)}
.w-clock .d{margin-top:6px;font-size:13px;color:var(--ink2);font-weight:600}
.w-clock .msg{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600}
.w-clock .bunny{position:absolute;right:14px;top:14px;width:96px;height:96px}
.w-small{border-radius:24px;padding:14px 15px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.w-small .lab{font-size:12px;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:5px}
.w-small .big{font-size:30px;font-weight:700;color:var(--p600);line-height:1.1}
.w-small .big small{font-size:13px;margin-left:3px;color:var(--ink2)}
.w-small .sub{font-size:11.5px;color:var(--ink2);font-weight:600}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;margin-top:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s}
.app:active{transform:scale(.9)}
.ico{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;position:relative;box-shadow:var(--shadow-s),inset 0 1px 0 rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.9)}
.ico svg{width:30px;height:30px}
.ico .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--p500);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.app span{font-size:12px;font-weight:600;color:var(--ink);text-shadow:0 1px 2px rgba(255,255,255,.8)}
.dock{margin-top:auto;margin-bottom:26px;border-radius:32px;padding:14px 16px;display:flex;justify-content:space-around}
.dock .app span{display:none}
.i-pink{background:linear-gradient(145deg,#ffd6e4,#ffadc8)}
.i-lav{background:linear-gradient(145deg,#efe4ff,#cfb8f7)}
.i-mint{background:linear-gradient(145deg,#e3fbf1,#b5ead5)}
.i-cream{background:linear-gradient(145deg,#fff5e3,#ffd9a8)}
.i-sky{background:linear-gradient(145deg,#e6f4ff,#b8dcfb)}
.i-rose{background:linear-gradient(145deg,#ffe6ea,#ffb9c4)}
.i-white{background:linear-gradient(145deg,#fff,#ffeef4)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;background:var(--p50);display:flex;flex-direction:column;z-index:20;
  transform:scale(.85) translateY(30px);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.9,.3,1.1),opacity .25s;border-radius:inherit;overflow:hidden}
.screen.open{transform:none;opacity:1;pointer-events:auto}
.screen.slide{transform:translateX(100%);opacity:1;z-index:30;transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.screen.slide.open{transform:none}
.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,#ffe2ec 0,transparent 45%),radial-gradient(circle at 0 100%,#f5ecff 0,transparent 45%);z-index:-1}
.nav{height:96px;padding:48px 14px 0;display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav h2{flex:1;font-size:18px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.nav h2 .typing{font-size:11px;color:var(--p500);font-weight:600}
.nbtn{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:var(--glass2);box-shadow:var(--shadow-s);flex-shrink:0}
.nbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nbtn.ghost{background:none;box-shadow:none}
.body{flex:1;overflow-y:auto;padding:6px 16px 40px}
.card{background:var(--glass2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-s);border:1px solid #fff;margin-bottom:14px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-size:12px;color:var(--p500);font-weight:600;cursor:pointer}
.muted{color:var(--ink2);font-size:12.5px}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:26px 0;font-weight:600}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:16px;background:linear-gradient(135deg,#ffb3cb,#f57fa5);color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(245,127,165,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--p100);color:var(--p600);box-shadow:none}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:12px}
.fab{position:absolute;right:20px;bottom:34px;width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#ffb3cb,#f57fa5);display:grid;place-items:center;box-shadow:0 10px 22px rgba(245,127,165,.45);z-index:5}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 6px 4px}
.inp{width:100%;background:#fff;border:1.5px solid var(--p200);border-radius:14px;padding:11px 14px;transition:border .2s}
.inp:focus{border-color:var(--p400)}
textarea.inp{resize:none;min-height:88px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--p200);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--p400);border-color:var(--p400);color:#fff}
.seg{display:flex;background:var(--p100);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:34px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--p600);box-shadow:var(--shadow-s)}
.row{display:flex;align-items:center;gap:10px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:none}
.x{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:var(--ink3);font-size:15px;flex-shrink:0}
.x:hover{background:var(--p100);color:var(--p500)}

/* ---------- sheet & toast ---------- */
.mask{position:absolute;inset:0;background:rgba(107,69,83,.22);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--p50);border-radius:30px 30px 0 0;z-index:90;transform:translateY(105%);transition:transform .34s cubic-bezier(.3,.85,.3,1);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(224,99,140,.2)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--p300);margin:10px auto 4px}
.sheet .sh{display:flex;align-items:center;padding:6px 20px 10px}
.sheet .sh h3{flex:1;font-size:17px;font-weight:700}
.sheet .sb{overflow-y:auto;padding:4px 20px 34px}
.toast{position:absolute;top:58px;left:50%;transform:translate(-50%,-20px);background:rgba(255,255,255,.95);padding:10px 18px;border-radius:18px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);z-index:100;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;color:var(--p600)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- wechat ---------- */
.wx-tabs{display:flex;height:74px;padding-bottom:20px;background:var(--glass2);backdrop-filter:blur(16px);border-top:1px solid #fff;flex-shrink:0}
.wx-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink3)}
.wx-tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wx-tabs button.on{color:var(--p500)}
.wx-tabs button.on svg{fill:var(--p200)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:9px 14px;margin-bottom:12px;color:var(--ink3);font-size:13.5px;border:1px solid var(--p100)}
.chatrow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--glass2);margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-s);border:1px solid #fff}
.chatrow:active{transform:scale(.98)}
.av{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:26px;flex-shrink:0;background:linear-gradient(145deg,#fff,#ffe1eb);border:2px solid #fff;box-shadow:var(--shadow-s);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:38px;height:38px;border-radius:14px;font-size:21px}
.chatrow .mid{flex:1;min-width:0}
.chatrow .nm{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.chatrow .nm time{font-size:11px;color:var(--ink3);font-weight:600}
.chatrow .pv{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.msgs{flex:1;overflow-y:auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;align-items:flex-start;max-width:100%;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.msg.me{flex-direction:row-reverse}
.bub{max-width:72%;padding:10px 14px;border-radius:6px 20px 20px 20px;background:#fff;font-size:15px;line-height:1.5;box-shadow:var(--shadow-s);word-break:break-word;white-space:pre-wrap}
.msg.me .bub{border-radius:20px 6px 20px 20px;background:linear-gradient(135deg,#ffc3d6,#ffa3c1);color:#fff;text-shadow:0 1px 1px rgba(224,99,140,.3)}
.msg.err .bub{background:#fff0f0;color:#c0607a;font-size:13px}
.tstamp{align-self:center;font-size:11px;color:var(--ink3);font-weight:600;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:10px}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--p300);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-6px)}}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 30px;background:var(--glass2);backdrop-filter:blur(16px);border-top:1px solid #fff;flex-shrink:0}
.composer textarea{flex:1;background:#fff;border:1.5px solid var(--p200);border-radius:18px;padding:9px 14px;resize:none;max-height:100px;height:40px;line-height:1.4}
.cbtn{width:40px;height:40px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;background:var(--p100)}
.cbtn svg{width:21px;height:21px;stroke:var(--p500);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.send{background:linear-gradient(135deg,#ffb3cb,#f57fa5)}
.cbtn.send svg{stroke:#fff}
.me-card{display:flex;align-items:center;gap:14px;padding:20px}
.me-card .av{width:66px;height:66px;font-size:36px;border-radius:22px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wk{font-size:11.5px;color:var(--ink3);font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;position:relative;transition:background .15s}
.day.out{color:var(--ink3);opacity:.45}
.day.today{color:var(--p600);font-weight:700;background:var(--p100)}
.day.sel{background:linear-gradient(135deg,#ffb3cb,#f57fa5)!important;color:#fff!important;box-shadow:0 4px 10px rgba(245,127,165,.4)}
.day .dt{position:absolute;bottom:5px;display:flex;gap:2px}
.day .dt i{width:5px;height:5px;border-radius:50%;background:var(--p400)}
.day.sel .dt i{background:#fff}
.day.pd{background:#ffe0ea;color:var(--p600)}
.day.pp{background:repeating-linear-gradient(45deg,#fff0f5,#fff0f5 4px,#ffe2ec 4px,#ffe2ec 8px);color:var(--p500)}
.day.fe{background:var(--lav)}
.day.ov:after{content:"✿";position:absolute;top:1px;right:4px;font-size:9px;color:#a588e6}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink2);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px}
.ev{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#fff;border-radius:14px;margin-bottom:8px;border-left:4px solid var(--p300)}
.ev .tm{font-size:12px;font-weight:700;color:var(--p500);width:42px}
.ev .tx{flex:1;font-size:14px;font-weight:600}

/* ---------- period ---------- */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;position:relative}
.ring{width:210px;height:210px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr small{font-size:12.5px;color:var(--ink2);font-weight:700}
.ring .ctr b{font-size:46px;color:var(--p600);line-height:1.1}
.ring .ctr span{font-size:12.5px;font-weight:700;color:var(--p500);background:var(--p100);padding:3px 10px;border-radius:10px;margin-top:4px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 2px}
.stat3 div{background:#fff;border-radius:16px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:17px;color:var(--p600)}
.stat3 small{font-size:11px;color:var(--ink2);font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:11px;background:var(--p100);color:var(--p600);font-size:18px;font-weight:700}
.stepper b{min-width:44px;text-align:center}
.tip{background:linear-gradient(135deg,#fff,#fff0f6);border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;font-weight:600}

/* ---------- ledger ---------- */
.ledger-hero{border-radius:26px;padding:18px;background:linear-gradient(140deg,#ffc6d8 0%,#ffa8c4 55%,#f7a2d4 100%);color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(245,127,165,.35);margin-bottom:14px}
.ledger-hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18)}
.ledger-hero .mon{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ledger-hero .mon button{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.3);color:#fff;font-weight:700}
.ledger-hero .amt{font-size:36px;font-weight:700;margin:10px 0 4px}
.ledger-hero .amt small{font-size:13px;opacity:.85;margin-right:6px}
.ledger-hero .two{display:flex;gap:24px;font-size:12.5px;font-weight:600;opacity:.95}
.bar{height:9px;border-radius:9px;background:var(--p100);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffc2d6,#f57fa5)}
.catrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:600}
.catrow .em{width:30px;height:30px;border-radius:11px;background:var(--p100);display:grid;place-items:center;font-size:16px}
.catrow .v{width:70px;text-align:right;color:var(--ink2)}
.daygrp{font-size:12px;font-weight:700;color:var(--ink2);margin:6px 4px 4px;display:flex;justify-content:space-between}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 4px}
.tx-item .em{width:40px;height:40px;border-radius:14px;background:var(--p100);display:grid;place-items:center;font-size:20px}
.tx-item .mid{flex:1}
.tx-item .mid b{font-size:14px;display:block}
.tx-item .mid small{font-size:11.5px;color:var(--ink2)}
.tx-item .amt{font-weight:700;font-size:15px}
.tx-item .amt.in{color:#4fb38a}
.keypad-amt{font-size:34px;font-weight:700;color:var(--p600);text-align:center;background:#fff;border-radius:18px;padding:10px;border:1.5px solid var(--p200);width:100%}

/* ---------- notes ---------- */
.notes-grid{columns:2;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;border-radius:20px;padding:14px;cursor:pointer;box-shadow:var(--shadow-s);border:1.5px solid rgba(255,255,255,.9);position:relative}

.note p{font-size:12.5px;color:var(--ink2);line-height:1.55;white-space:pre-wrap;max-height:130px;overflow:hidden}
.note time{display:block;margin-top:8px;font-size:10.5px;color:var(--ink3);font-weight:700}
.n-pink{background:#ffe6ee}.n-lav{background:#efe6ff}.n-mint{background:#e2f7ee}.n-cream{background:#fff3df}.n-sky{background:#e3f1ff}
.colors{display:flex;gap:10px}
.colors i{width:30px;height:30px;border-radius:11px;cursor:pointer;border:2.5px solid #fff;box-shadow:var(--shadow-s)}
.colors i.on{outline:2.5px solid var(--p400)}

/* ---------- mood ---------- */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;background:#fff;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink2);border:2px solid transparent;transition:.15s}
.mood em{font-style:normal;font-size:28px}
.mood.on{border-color:var(--p400);background:var(--p100);color:var(--p600);transform:translateY(-3px)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mgrid div{aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;position:relative}
.mgrid div small{position:absolute;top:2px;left:5px;font-size:9px;color:var(--ink3);font-weight:700}
.diary{padding:12px;background:#fff;border-radius:16px;margin-bottom:8px;display:flex;gap:10px}
.diary em{font-style:normal;font-size:24px}
.diary b{font-size:12px;color:var(--ink2)}
.diary p{font-size:13.5px;line-height:1.5;margin-top:2px}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.set-row:last-child{border-bottom:none}
.set-row .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px}
.set-row .t{flex:1;font-weight:600;font-size:14.5px}
.set-row .v{font-size:12.5px;color:var(--ink2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.walls i{aspect-ratio:.55;border-radius:14px;cursor:pointer;border:3px solid #fff;box-shadow:var(--shadow-s)}
.walls i.on{outline:3px solid var(--p400)}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emojis button{aspect-ratio:1;border-radius:14px;background:#fff;font-size:24px;border:2px solid transparent}
.emojis button.on{border-color:var(--p400);background:var(--p100)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--p200);position:relative;transition:.2s;flex-shrink:0}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.switch.on{background:var(--p500)}
.switch.on:after{left:21px}
</style>

/* ================= Period ================= */
function sortedRecs(){return S.period.records.slice().sort()}
function avgCycle(){const r=sortedRecs();if(r.length<2)return S.period.cycle;const gaps=[];for(let i=1;i<r.length;i++){const g=diffDays(r[i],r[i-1]);if(g>15&&g<60)gaps.push(g)}return gaps.length?Math.round(gaps.slice(-6).reduce((a,b)=>a+b,0)/Math.min(gaps.length,6)):S.period.cycle}
function phaseOf(s){
  const r=sortedRecs();if(!r.length)return null;const L=S.period.len,C=S.period.cycle;
  for(const st of r){const k=diffDays(s,st);if(k>=0&&k<L)return 'period'}
  const last=r[r.length-1];const k=diffDays(s,last);
  if(k<0)return null;
  const off=k%C;const n=Math.floor(k/C);
  if(off<L&&n>=1)return 'pred';
  const ov=C-14;if(off===ov)return 'ovu';if(off>=ov-5&&off<=ov+1)return 'fertile';
  return 'safe';
}
function periodStatus(s){
  const r=sortedRecs();if(!r.length)return null;const L=S.period.len,C=S.period.cycle;const last=r[r.length-1];
  const k=diffDays(s,last);
  if(k>=0&&k<L)return {inPeriod:true,day:k+1,cycleDay:k+1,next:addDays(last,C)};
  let next=addDays(last,C);while(diffDays(s,next)>=C)next=addDays(next,C);
  const until=diffDays(next,s);
  const cd=((k%C)+C)%C+1;
  return {inPeriod:false,until:Math.max(until,0),late:until<0,cycleDay:cd,next,phase:phaseOf(s)};
}

    <div class="legend"><span><i style="background:#ffe0ea"></i>经期</span><span><i style="background:repeating-linear-gradient(45deg,#fff0f5,#fff0f5 3px,#ffe2ec 3px,#ffe2ec 6px)"></i>预测</span><span><i style="background:var(--lav)"></i>易孕期</span><span>✿ 排卵日</span></div>

  const n=id?S.notes.find(x=>x.id===id):{title:'',body:'',color:'pink'};let col=n.color;
  sheet(id?'编辑便利贴':'新便利贴',`<div class="field"><input class="inp" id="nT" value="${esc(n.title)}" placeholder="标题"></div>
  <div class="field"><textarea class="inp" id="nB" style="min-height:160px" placeholder="写点什么…">${esc(n.body)}</textarea></div>
  <div class="field"><div class="colors">${NCOL.map(c=>`<i style="background:${NCOLV[c]}" data-c="${c}" class="${c===col?'on':''}"></i>`).join('')}</div></div>
  <div class="row" style="gap:10px">${id?'<button class="btn soft" id="nD" style="flex:1">删除</button>':''}<button class="btn" id="nS" style="flex:2">保存</button></div>`,b=>{
    b.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{col=x.dataset.c;b.querySelectorAll('[data-c]').forEach(y=>y.classList.toggle('on',y===x))});
    b.querySelector('#nS').onclick=()=>{const title=b.querySelector('#nT').value.trim(),body=b.querySelector('#nB').value.trim();if(!title&&!body)return closeSheet();
      if(id)Object.assign(n,{title,body,color:col,t:Date.now()});else S.notes.push({id:uid(),title,body,color:col,t:Date.now()});save();closeSheet();RENDER.notes()};
    id&&(b.querySelector('#nD').onclick=()=>{S.notes=S.notes.filter(x=>x.id!==id);save();closeSheet();RENDER.notes()});
  });
}
$('#noteAdd').onclick=()=>editNote();

/* ================= Mood ================= */
const MOODS=[['🥰','超开心'],['😊','不错'],['😐','一般'],['😢','难过'],['😤','生气']];
RENDER.mood=()=>{
  const t=today(),cur=S.moods[t]||{};const d=new Date(),y=d.getFullYear(),m=d.getMonth();const days=new Date(y,m+1,0).getDate();const pad=new Date(y,m,1).getDay();
  const recent=Object.entries(S.moods).filter(([,v])=>v.text).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);
  $('#moodBody').innerHTML=`<div class="card"><h3>🌈 今天心情怎么样？</h3><div class="moods">${MOODS.map(([e,n])=>`<div class="mood ${cur.m===e?'on':''}" data-m="${e}"><em>${e}</em>${n}</div>`).join('')}</div>
    <textarea class="inp" id="mT" style="margin-top:12px;min-height:80px" placeholder="写写今天发生的小事吧～">${esc(cur.text||'')}</textarea><button class="btn block" id="mS" style="margin-top:10px">保存今天</button></div>
    <div class="card"><h3>📅 ${m+1}月心情</h3><div class="mgrid">${WEEK.map(w=>`<div style="background:none;aspect-ratio:auto;font-size:11px;color:var(--ink3);font-weight:700">${w}</div>`).join('')}${'<div style="background:none"></div>'.repeat(pad)}${Array.from({length:days},(_,i)=>{const s=ymd(new Date(y,m,i+1));return `<div><small>${i+1}</small>${S.moods[s]?.m||''}</div>`}).join('')}</div></div>
    ${recent.length?`<div class="card"><h3>📖 最近的日记</h3>${recent.map(([d,v])=>`<div class="diary"><em>${v.m||'📝'}</em><div><b>${d.replace(/-/g,'/')}</b><p>${esc(v.text)}</p></div></div>`).join('')}</div>`:''}`;
  let sel=cur.m;
  $('#moodBody').querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{sel=x.dataset.m;$('#moodBody').querySelectorAll('[data-m]').forEach(y=>y.classList.toggle('on',y===x))});
  $('#mS').onclick=()=>{if(!sel)return toast('先选一个心情吧');S.moods[t]={m:sel,text:$('#mT').value.trim()};save();RENDER.mood();toast('今天的心情已收藏 💝')};
};

/* ================= Water ================= */
RENDER.water=()=>{
  const t=today(),goal=8,n=S.water[t]||0;
  const week=Array.from({length:7},(_,i)=>{const s=addDays(t,i-6);return {s,n:S.water[s]||0}});
  $('#waterBody').innerHTML=`<div class="card" style="text-align:center"><h3 style="justify-content:center">今天喝了 ${n} / ${goal} 杯</h3>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 6px">${Array.from({length:goal},(_,i)=>`<div style="aspect-ratio:.8;border-radius:12px 12px 18px 18px;border:2.5px solid ${i<n?'#9fd0f7':'var(--p200)'};background:${i<n?'linear-gradient(180deg,#e6f4ff 30%,#9fd0f7 30%)':'#fff'};display:grid;place-items:center;font-size:20px">${i<n?'💧':''}</div>`).join('')}</div>
    <div class="row" style="gap:10px"><button class="btn soft" style="flex:1" id="wM">撤销</button><button class="btn" style="flex:2" id="wP">＋ 喝了一杯</button></div>
    <p class="muted" style="margin-top:10px">${n>=goal?'太棒啦！今天的目标达成 🎉':'还差 '+(goal-n)+' 杯，水润润的才可爱 ✨'}</p></div>
    <div class="card"><h3>🗓 最近 7 天</h3><div style="display:flex;align-items:flex-end;gap:8px;height:110px">${week.map(w=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span style="font-size:10.5px;color:var(--ink2);font-weight:700">${w.n}</span><div style="width:100%;border-radius:8px;background:linear-gradient(180deg,#bfe1fb,#ffb3cb);height:${Math.min(w.n/goal,1)*70+4}px"></div><small style="font-size:10.5px;color:var(--ink3);font-weight:700">${WEEK[parse(w.s).getDay()]}</small></div>`).join('')}</div></div>`;
  $('#wP').onclick=()=>{S.water[t]=n+1;save();RENDER.water()};$('#wM').onclick=()=>{S.water[t]=Math.max(0,n-1);save();RENDER.water()};
};

/* ================= Settings ================= */
RENDER.settings=()=>{
  const u=S.settings;
  $('#setBody').innerHTML=`<div class="card me-card" id="sProfile" style="cursor:pointer">${avatarHTML(u.userAvatar)}<div style="flex:1"><b style="font-size:18px">${esc(u.userName)}</b><div class="muted" style="margin-top:4px">${esc(u.sign)}</div></div><span class="muted">编辑 ›</span></div>
  <div class="card"><h3>🤖 AI 接口 <span class="more" style="color:${u.apiKey?'#4fb38a':'var(--ink3)'}">${u.apiKey?'● 已配置':'○ 离线模式'}</span></h3>
    <div class="field"><label>API 地址（兼容 OpenAI 格式）</label><input class="inp" id="aB" value="${esc(u.apiBase)}" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><label>API Key</label><input class="inp" id="aK" type="password" value="${esc(u.apiKey)}" placeholder="sk-..."></div>
    <div class="field"><label>模型</label><div class="row"><input class="inp" id="aM" value="${esc(u.model)}" list="mlist" style="flex:1"><button class="btn soft sm" id="aFetch">拉取</button></div><datalist id="mlist"></datalist></div>
    <div class="row" style="gap:10px"><div class="field" style="flex:1"><label>温度 ${u.temp}</label><input type="range" min="0" max="1.5" step="0.1" value="${u.temp}" id="aT" style="width:100%;accent-color:var(--p500)"></div><div class="field" style="flex:1"><label>上下文条数</label><input class="inp" id="aC" type="number" value="${u.ctx}" min="2" max="100"></div></div>
    <div class="list-item" style="padding:6px 2px 12px"><span style="flex:1;font-weight:600;font-size:14px">回复拆成多条气泡</span><button class="switch ${u.split?'on':''}" id="aS"></button></div>
    <div class="row" style="gap:10px"><button class="btn soft" style="flex:1" id="aTest">测试连接</button><button class="btn" style="flex:1" id="aSave">保存</button></div></div>
  <div class="card"><h3>🖼 壁纸</h3><div class="walls">${WALLS.map((w,i)=>`<i style="background:${w}" data-w="${i}" class="${i===u.wall?'on':''}"></i>`).join('')}</div></div>
  <div class="card" style="padding:4px 16px">
    <div class="set-row" id="dExp"><span class="ic i-mint">📤</span><span class="t">导出数据备份</span><span class="muted">›</span></div>
    <div class="set-row" id="dImp"><span class="ic i-sky">📥</span><span class="t">导入数据</span><span class="muted">›</span></div>
    <div class="set-row" id="dClr"><span class="ic i-rose">🗑</span><span class="t">清空所有数据</span><span class="muted">›</span></div></div>
  <p class="muted" style="text-align:center;margin:6px 0 10px">🍓 草莓小手机 v1.0 · 数据仅保存在本机</p>`;
  const B=$('#setBody');
  B.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{u.wall=+x.dataset.w;save();applyWall();RENDER.settings()});
  const T=B.querySelector('#aT');T.oninput=()=>T.previousElementSibling.textContent='温度 '+T.value;
  const sw=B.querySelector('#aS');sw.onclick=()=>sw.classList.toggle('on');
  const grab=()=>{u.apiBase=B.querySelector('#aB').value.trim()||DEFAULT.settings.apiBase;u.apiKey=B.querySelector('#aK').value.trim();u.model=B.querySelector('#aM').value.trim()||DEFAULT.settings.model;u.temp=+T.value;u.ctx=Math.max(2,+B.querySelector('#aC').value||20);u.split=sw.classList.contains('on')};
  B.querySelector('#aSave').onclick=()=>{grab();save();RENDER.settings();toast('设置已保存 ♡')};
  B.querySelector('#aTest').onclick=async()=>{grab();save();toast('连接中…');try{const r=await callAI([{role:'user',content:'用一句可爱的话跟我打个招呼'}]);toast('连接成功 ✓');sheet('测试成功 🎉',`<div class="card" style="font-size:14px;line-height:1.6">${esc(r)}</div>`)}catch(e){toast('连接失败 >_<');sheet('连接失败',`<div class="card" style="font-size:13px;color:#c0607a;word-break:break-all">${esc(e.message)}</div><p class="muted">请检查 API 地址、Key 和模型名称，部分接口可能不支持浏览器跨域访问。</p>`)}};
  B.querySelector('#aFetch').onclick=async()=>{grab();try{const r=await fetch(u.apiBase.replace(/\/+$/,'')+'/models',{headers:{Authorization:'Bearer '+u.apiKey}});const j=await r.json();const ids=(j.data||[]).map(x=>x.id);B.querySelector('#mlist').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');toast(`拉取到 ${ids.length} 个模型`)}catch(e){toast('拉取失败')}};
  B.querySelector('#sProfile').onclick=editProfile;
  B.querySelector('#dExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='草莓小手机备份-'+today()+'.json';a.click();toast('已导出 ✓')};
  B.querySelector('#dImp').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());S=Object.assign(structuredClone(DEFAULT),d);save();applyWall();RENDER.settings();toast('导入成功 ✓')}catch(e){toast('文件格式不对哦')}};f.click()};
  B.querySelector('#dClr').onclick=()=>{if(confirm('真的要清空所有数据吗？此操作不能撤销哦')){localStorage.removeItem(KEY);location.reload()}};
};
function editProfile(){
  const u=S.settings;let av=u.userAvatar;
  sheet('我的资料 🎀',`<div class="field"><label>头像</label><div class="emojis">${AVATARS.map(a=>`<button data-av="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div></div>
  <div class="field"><label>昵称</label><input class="inp" id="pN" value="${esc(u.userName)}"></div>
  <div class="field"><label>个性签名</label><input class="inp" id="pS" value="${esc(u.sign)}"></div><button class="btn block" id="pSave">保存</button>`,b=>{
    b.querySelectorAll('[data-av]').forEach(x=>x.onclick=()=>{av=x.dataset.av;b.querySelectorAll('[data-av]').forEach(y=>y.classList.toggle('on',y===x))});
    b.querySelector('#pSave').onclick=()=>{u.userAvatar=av;u.userName=b.querySelector('#pN').value.trim()||'草莓小姐';u.sign=b.querySelector('#pS').value.trim();save();closeSheet();RENDER[current]&&RENDER[current]()};
  });
}

/* ================= boot ================= */
applyWall();tick();setInterval(tick,15000);renderHome();
</script>
</body>
</html>
